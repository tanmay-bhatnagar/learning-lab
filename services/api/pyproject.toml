[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-lab-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "anyio>=4,<5", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "httpx>=0.27,<1", "markitdown[pdf]>=0.1.2,<1", "firecrawl-anydoc>=0.2.4,<1", "docling==2.127.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

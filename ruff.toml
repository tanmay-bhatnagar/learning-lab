target-version = "py311"
line-length = 120
extend-exclude = [".local", ".venv", "data", "node_modules", "skills"]

[lint]
select = ["E9", "F63", "F7", "F82", "A001", "B", "BLE001", "ANN001", "ANN201", "RUF100"]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[lint.per-file-ignores]
# Annotations are enforced for application code only.
"!services/api/lab/**" = ["ANN001", "ANN201"]
# Existing offenders; each refactor slice deletes the entries it resolves.
"services/api/lab/index.py" = ["A001", "ANN001"]
"services/api/lab/storage.py" = ["B904", "ANN001", "ANN201"]
"services/api/lab/main.py" = ["BLE001", "ANN001", "ANN201"]
"services/api/lab/{chunking,context,docling_pipeline,models,parse_pipeline,retrieval}.py" = ["ANN001", "ANN201"]
